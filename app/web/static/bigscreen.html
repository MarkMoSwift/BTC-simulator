<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>区块链科普模拟器 · 课堂大屏</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="screen">
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><path d="m14 13-7.5 7.5a2.12 2.12 0 0 1-3-3L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></symbol>
  </svg>

  <header class="screen-top">
    <div class="screen-brand">
      <span class="screen-logo"><svg class="icon"><use href="#i-zap"/></svg></span>
      <div>
        <h1 id="screen-classroom">区块链科普模拟器</h1>
        <p class="screen-sub" id="screen-sub">正在连接课堂网络…</p>
      </div>
    </div>
    <dl class="metrics">
      <div class="metric"><dt>区块高度</dt><dd id="metric-height">0</dd></div>
      <div class="metric"><dt>出块难度</dt><dd id="metric-difficulty">--</dd></div>
      <div class="metric"><dt>全网算力</dt><dd id="metric-hashrate">0 H/s</dd></div>
      <div class="metric"><dt>在线矿工</dt><dd id="metric-online">0</dd></div>
      <div class="metric"><dt>最新区块</dt><dd id="metric-latest">--</dd></div>
    </dl>
  </header>

  <main class="screen-main" id="main-content">
    <section class="board board-hashrate">
      <header class="board-head">
        <h2><svg class="icon"><use href="#i-trophy"/></svg>实时算力榜</h2>
        <span class="board-note" id="hashrate-note">等待同学加入</span>
      </header>
      <ol class="board-list" id="board-hashrate"></ol>
    </section>

    <section class="board board-mined">
      <header class="board-head">
        <h2><svg class="icon"><use href="#i-trophy"/></svg>累计挖矿榜</h2>
        <span class="board-note" id="mined-note">按链上确认的挖矿收入统计</span>
      </header>
      <ol class="board-list" id="board-mined"></ol>
    </section>
  </main>

  <footer class="screen-foot">
    <section class="strip">
      <h3><svg class="icon"><use href="#i-box"/></svg>最新区块</h3>
      <ul class="strip-list" id="strip-blocks"></ul>
    </section>
    <section class="strip">
      <h3><svg class="icon"><use href="#i-gift"/></svg>链上红包</h3>
      <ul class="strip-list" id="strip-packets"></ul>
    </section>
    <section class="strip">
      <h3><svg class="icon"><use href="#i-image"/></svg>藏品市场</h3>
      <ul class="strip-list" id="strip-market"></ul>
    </section>
    <section class="strip">
      <h3><svg class="icon"><use href="#i-gavel"/></svg>藏品拍卖</h3>
      <ul class="strip-list" id="strip-auctions"></ul>
    </section>
  </footer>

  <div class="block-banner" id="block-banner" hidden></div>
  <div class="screen-announcement" id="screen-announcement" hidden></div>

  <script src="/static/client.js"></script>
  <script src="/static/bigscreen.js"></script>
</body>
</html>
